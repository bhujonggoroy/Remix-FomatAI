<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormatAI - AI Academic Document Formatter</title>
    <meta name="description" content="AI-powered academic document formatting application with Python FastAPI backend" />
    <meta property="og:title" content="FormatAI - AI Academic Document Formatter" />
    <meta property="og:description" content="AI-powered academic document formatting application with Python FastAPI backend" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (text.indexOf('websocket') !== -1 || text.indexOf('WebSocket') !== -1 || text.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            var isVite = protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf('vite') !== -1;
            if (isVite) {
              var target = new EventTarget();
              var fakeWs = {
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                send: function() {},
                close: function() {
                  fakeWs.readyState = 3;
                  if (fakeWs.onclose) fakeWs.onclose(new Event('close'));
                  target.dispatchEvent(new Event('close'));
                },
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (fakeWs.readyState === 1) {
                  var ev = new Event('open');
                  if (fakeWs.onopen) fakeWs.onopen(ev);
                  target.dispatchEvent(ev);
                }
              }, 10);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
